server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      routes:
        # 1. Microservicio de Usuarios (Auth, Usuarios, Ubicaciones)
        - id: ms-usuario
          uri: http://localhost:8081
          predicates:
            - Path=/api/usuarios/**, /api/auth/**, /api/regiones/**

        # 2. Microservicio de Catálogo (Productos, Categorías, Inventario)
        - id: ms-catalogo
          uri: http://localhost:8082
          predicates:
            - Path=/api/productos/**, /api/categorias/**, /api/inventario/**

        # 3. Microservicio de Ventas (Ventas, Carrito, Boletas)
        - id: ms-ventas
          uri: http://localhost:8083
          predicates:
            - Path=/api/ventas/**, /api/carrito/**, /api/boletas/**

        # 4. Microservicio de Administración (Configuración, Contacto, Reportes)
        - id: ms-administracion
          uri: http://localhost:8084
          predicates:
            - Path=/api/configuracion/**, /api/contactos/**, /api/reportes/**

      # Configuración CORS para permitir que React (puerto 5173) se conecte
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true