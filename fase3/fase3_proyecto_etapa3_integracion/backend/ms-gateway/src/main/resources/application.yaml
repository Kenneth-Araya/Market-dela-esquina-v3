server:
  port: 8080

spring:
  application:
    name: ms-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: ms-usuario
              uri: ${USUARIO_URL:http://localhost:8081}
              predicates:
                - Path=/api/usuarios/**, /api/auth/**, /api/regiones/**

            - id: ms-catalogo
              uri: ${CATALOGO_URL:http://localhost:8082}
              predicates:
                - Path=/api/productos/**, /api/categorias/**, /api/inventario/**

            - id: ms-ventas
              uri: ${VENTAS_URL:http://localhost:8083}
              predicates:
                - Path=/api/ventas/**, /api/carrito/**, /api/boletas/**

            - id: ms-administracion
              uri: ${ADMINISTRACION_URL:http://localhost:8084}
              predicates:
                - Path=/api/configuracion/**, /api/contactos/**, /api/reportes/**

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_UNIQUE

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                  - "http://3.89.6.152"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true