services:
  ms-usuario:
    build: ./ms-usuario
    container_name: ms-usuario
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - market-net

  ms-catalogo:
    build: ./ms-catalogo
    container_name: ms-catalogo
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - market-net

  ms-ventas:
    build: ./ms-ventas
    container_name: ms-ventas
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      - USUARIO_URL=http://ms-usuario:8081
      - CATALOGO_URL=http://ms-catalogo:8082
    depends_on:
      - ms-usuario
      - ms-catalogo
    networks:
      - market-net

  ms-administracion:
    build: ./ms-administracion
    container_name: ms-administracion
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - USUARIO_URL=http://ms-usuario:8081
      - CATALOGO_URL=http://ms-catalogo:8082
      - VENTAS_URL=http://ms-ventas:8083
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - ms-usuario
      - ms-catalogo
      - ms-ventas
    networks:
      - market-net

  ms-gateway:
    build: ./ms-gateway
    container_name: ms-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - USUARIO_URL=http://ms-usuario:8081
      - CATALOGO_URL=http://ms-catalogo:8082
      - VENTAS_URL=http://ms-ventas:8083
      - ADMINISTRACION_URL=http://ms-administracion:8084
    depends_on:
      - ms-usuario
      - ms-catalogo
      - ms-ventas
      - ms-administracion
    networks:
      - market-net


  frontend:
    build: ../frontend
    container_name: market-frontend
    ports:
      - "80:80"
    depends_on:
      - ms-gateway
    networks:
      - market-net

networks:
  market-net:
    driver: bridge
